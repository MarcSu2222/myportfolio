<html>
<head>
    <link rel="stylesheet" href="summative3.css">
</head>
<body>

    <div class="theme-bar">
        <button class="classic" onclick="setSkin('classic')">Classic</button>
        <button class="arsenal" onclick="setSkin('arsenal')">Arsenal</button>
        <button class="barcelona" onclick="setSkin('barcelona')">Barcelona</button>
        <button class="madrid" onclick="setSkin('madrid')">Madrid</button>
        <button class="bayern" onclick="setSkin('bayern')">Bayern</button>
        <button class="brazil" onclick="setSkin('brazil')">Brazil</button>
        <button class="argentina" onclick="setSkin('argentina')">Argentina</button>
        <button class="spain" onclick="setSkin('spain')">Spain</button>
        <button class="germany" onclick="setSkin('germany')">Germany</button>
    </div>

    <div class="calculator classic" id="calc">
        <div class="numberfield">
            <div class="screen">
                <div id="nftext">0</div>
            </div>

            <div class="grid">
                <button>Del</button>
                <button>AC</button>
                <button>%</button>
                <button>÷</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>×</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>

                <button>xʸ</button>
                <button>0</button>
                <button>.</button>
                <button>=</button>

            </div>


                <div class="logospace">
                    <img id="logo" src="soccer.png">
                </div>

            </div>
        </div>
    </div>

<script>
    function setSkin(skinName) {
        var calc = document.getElementById('calc');
        var logo = document.getElementById('logo');

        calc.className = 'calculator ' + skinName;

        if (skinName == 'classic') {
            logo.src = 'soccer.png';
        }
        if (skinName == 'arsenal') {
            logo.src = 'arsenal.png';
        }
        if (skinName == 'barcelona') {
            logo.src = 'barca.png';
        }
        if (skinName == 'madrid') {
            logo.src = 'madrid.png';
        }
        if (skinName == 'bayern') {
            logo.src = 'bayern.png';
        }
        if (skinName == 'brazil') {
            logo.src = 'brazil.png';
        }
        if (skinName == 'argentina') {
            logo.src = 'argentina.png';
        }
        if (skinName == 'spain') {
            logo.src = 'spain.png';
        }
        if (skinName == 'germany') {
            logo.src = 'germany.png';
        }
    }

    var total = "";
    var operator = "";
    var number = "";

    window.onclick = function(event) {
        if (event.target.tagName == 'BUTTON' && event.target.closest('.grid')) {
            var val = event.target.innerHTML;
            var display = document.getElementById('nftext');

            if (val == 'AC') {
                total = "";
                operator = "";
                number = "";
                display.innerHTML = "0";
            }

            if (val == 'Del') {
                if (number !== "") {
                    number = number.slice(0, -1);
                    display.innerHTML = number === "" ? "0" : number;
                } else if (operator !== "") {
                    operator = "";
                    display.innerHTML = total;
                } else {
                    total = total.slice(0, -1);
                    display.innerHTML = total === "" ? "0" : total;
                }
            }

            if (val == '0' || val == '1' || val == '2' || val == '3' || val == '4' || val == '5' || val == '6' || val == '7' || val == '8' || val == '9') {
                if (operator == "") {
                    if (total.length < 8) {
                        total = total + val;
                        display.innerHTML = total;
                    }
                } else {
                    if (number.length < 8) {
                        number = number + val;
                        display.innerHTML = number;
                    }
                }
            }

            if (val == '.') {
                if (operator == "") {
                    if (!total.includes('.')) {
                        total = total == "" ? "0." : total + ".";
                        display.innerHTML = total;
                    }
                } else {
                    if (!number.includes('.')) {
                        number = number == "" ? "0." : number + ".";
                        display.innerHTML = number;
                    }
                }
            }

            if (val == '+' || val == '-' || val == '×' || val == '÷' || val == 'xʸ') {
                if (number !== "") {
                    var num1 = Number(total);
                    var num2 = Number(number);

                    if (operator == 'plus') { num1 = num1 + num2; }
                    if (operator == 'minus') { num1 = num1 - num2; }
                    if (operator == 'multiply') { num1 = num1 * num2; }
                    if (operator == 'divide') { num1 = num1 / num2; }
                    if (operator == 'power') { num1 = Math.pow(num1, num2); }

                    total = String(num1);
                    display.innerHTML = total;
                    number = "";
                }

                if (val == '+') { operator = "plus"; }
                if (val == '-') { operator = "minus"; }
                if (val == '×') { operator = "multiply"; }
                if (val == '÷') { operator = "divide"; }
                if (val == 'xʸ') { operator = "power"; }
            }

            if (val == '%') {
                if (operator == "") {
                    if (total !== "") {
                        total = String(Number(total) / 100);
                        display.innerHTML = total;
                    }
                } else {
                    if (number !== "") {
                        number = String(Number(number) / 100);
                        display.innerHTML = number;
                    }
                }
            }

            if (val == '=') {
                var num1 = Number(total);
                var num2 = Number(number);

                if (operator == 'plus') { num1 = num1 + num2; }
                if (operator == 'minus') { num1 = num1 - num2; }
                if (operator == 'multiply') { num1 = num1 * num2; }
                if (operator == 'divide') { num1 = num1 / num2; }
                if (operator == 'power') { num1 = Math.pow(num1, num2); }

                total = String(num1);
                display.innerHTML = total;
                number = "";
                operator = "";
            }
        }
    };
</script>  
</body>
</html>
